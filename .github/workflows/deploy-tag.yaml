on:
  workflow_dispatch:
    branches:
      - main
      - master
    inputs:
      tag:
        description: Tag to deploy
        required: true
      environment:
        description: Select environment
        required: true
        type: environment
      service-name:
        type: choice
        description: Select Service
        options:
          - webapp

name: Deploy tag
run-name: 'Deploy Tag(${{ github.event.inputs.environment }}): ${{ github.event.inputs.tag }}'

jobs:
  deploy-tag:
    uses: Rhino-Energy/github-actions/.github/workflows/deploy-tag-monorepo-single-tag.yaml@main
    secrets: inherit
    with:
      tag: ${{ github.event.inputs.tag }}
      environment: ${{ github.event.inputs.environment }}
      service-name: ${{ github.event.inputs.service-name }}
